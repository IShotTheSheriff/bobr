name: Bazel invalidation proof

# This experiment deliberately builds changed fixtures with a fresh cache.
# Ordinary application commits use the cached build and test workflow.
on:
  push:
    branches: ["main", "bazel"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whether this update needs the proof
        id: changes
        run: python3 scripts/next-proof-trigger.py
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.required == 'true'
        with:
          node-version-file: .nvmrc
      - run: npm install -g @bazel/bazelisk
        if: steps.changes.outputs.required == 'true'
      - name: Install browser system libraries
        if: steps.changes.outputs.required == 'true'
        run: npx --yes playwright@1.61.0 install-deps chromium
      - name: Prove unused exports skip Next and Playwright
        if: steps.changes.outputs.required == 'true'
        run: python3 scripts/prove-next-invalidation.py --remote --browser --directory "${{ runner.temp }}/bobr-next-proof"
      - name: Save action evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: next-invalidation-evidence
          path: |
            ${{ runner.temp }}/bobr-next-proof/results.json
            ${{ runner.temp }}/bobr-next-proof/remote-cache-evidence.json
            ${{ runner.temp }}/bobr-next-proof/*.log
            ${{ runner.temp }}/bobr-next-proof/*.actions.json
          if-no-files-found: ignore

  # The projection is a hand-written model of what Next reads. This job builds
  # every app again against whole workspace packages and compares the two
  # deployment archives. A missing Tailwind class or a dropped side effect
  # shows up only here.
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whether this update needs the check
        id: changes
        run: python3 scripts/next-proof-trigger.py
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.required == 'true'
        with:
          node-version-file: .nvmrc
      - run: npm install -g @bazel/bazelisk
        if: steps.changes.outputs.required == 'true'
      - name: Compare projected and whole builds of every app
        if: steps.changes.outputs.required == 'true'
        run: |
          # The checks are manual, so //... skips them. The tag finds every app.
          targets=$(bazel query 'attr(tags, "\bequivalence\b", //...)')
          bazel test $targets --test_output=errors
