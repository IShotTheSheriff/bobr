name: Invalidation proof

# This experiment builds edited copies of the repository with a fresh cache.
# After every edit it builds each app CI reused again and compares the
# archives, so a change byakugan missed fails the run. Ordinary application
# commits skip it.
on:
  push:
    branches: ["main", "byakugan"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whether this update needs the proof
        id: changes
        run: python3 scripts/next-proof-trigger.py
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.required == 'true'
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.required == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.required == 'true'
      - name: Install Chromium
        if: steps.changes.outputs.required == 'true'
        run: pnpm --filter @repo/web-e2e exec playwright install --with-deps chromium
      - name: Prove that edits rerun only the tasks that read them
        if: steps.changes.outputs.required == 'true'
        run: node scripts/prove-invalidation.ts --browser --directory "${{ runner.temp }}/proof"
      - name: Save the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: invalidation-evidence
          path: |
            ${{ runner.temp }}/proof/results.json
            ${{ runner.temp }}/proof/*.log
            ${{ runner.temp }}/proof/*.json
          if-no-files-found: ignore
