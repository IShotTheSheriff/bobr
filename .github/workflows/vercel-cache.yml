name: Vercel cache across machines

# Two fresh runners use the developer path of the shared cache: one builds and
# uploads to Vercel, the other must restore every Next build and test result.
on:
  push:
    branches: ["main", "bazel"]
    paths:
      - tools/bazel/vercel-cache.cjs
      - scripts/bazel.py
      - .github/workflows/vercel-cache.yml
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The deploy token in the preview environment reads and writes the cache.
  BAZEL_REMOTE_CACHE: vercel
  TARGETS: >-
    //apps/web:next_build //apps/docs:next_build
    //packages/web-e2e:test //packages/docs-e2e:test
    //apps/web:typecheck //apps/docs:typecheck
    //apps/web:lib/calculator.test //apps/docs:lib/calculator.test

jobs:
  upload:
    name: Build and share from one runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      BAZEL_REMOTE_UPLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install Bazelisk and browser system libraries
        run: |
          npm install -g @bazel/bazelisk
          npx --yes playwright@1.61.0 install-deps chromium
      - name: Build without a disk cache
        # `shell: bash` adds pipefail, so a failed build is not hidden by tee.
        shell: bash
        run: python3 scripts/bazel.py test $TARGETS --disk_cache= 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Report Vercel cache use
        if: always()
        run: |
          grep -oE "(Vercel cache: |Vercel's Remote Cache).*" "$RUNNER_TEMP/build.log" | tee -a "$GITHUB_STEP_SUMMARY"

  restore:
    name: Restore on a fresh runner
    needs: [upload]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      BAZEL_REMOTE_UPLOAD: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install Bazelisk
        run: npm install -g @bazel/bazelisk
      # No browser libraries here: the browser tests must come from the cache.
      - name: Build without a disk cache
        shell: bash
        run: |
          python3 scripts/bazel.py test $TARGETS --disk_cache= \
            --execution_log_json_file="$RUNNER_TEMP/restore.exec.json" 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Require every Next build and test result from Vercel
        run: |
          grep -oE "Vercel cache: .*" "$RUNNER_TEMP/build.log" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci-summary.py "$RUNNER_TEMP/restore.exec.json"
          python3 - "$RUNNER_TEMP/restore.exec.json" <<'EOF'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location("summary", "scripts/ci-summary.py")
          summary = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(summary)
          ran, cached = summary.summarize(summary.spawns(sys.argv[1]))
          if ran or not cached:
              sys.exit(f"Built on the fresh runner instead of restoring: {sorted(ran)}")
          print(f"Restored {len(cached)} Next builds and test results from Vercel.")
          EOF
