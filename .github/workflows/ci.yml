name: CI (byakugan)

on:
  push:
    branches: ["main", "byakugan"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: test-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      DEPLOY_TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check CI helper behavior
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node --test scripts/test_vercel_reuse.ts tools/ci/check-deployment.test.ts
      # One cache entry holds every stored archive and test result. A run
      # restores the newest entry, and pull requests read the ones main saved.
      - name: Restore stored results
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/ci
          key: ci-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ci-${{ runner.os }}-${{ runner.arch }}-
      - name: Note the restored entries
        run: |
          mkdir -p .cache/ci
          find .cache/ci -type f | wc -l > "$RUNNER_TEMP/cache-entries"
      - name: Plan
        id: plan
        run: node tools/ci/run.ts test --plan
      # Only browser tests that run need Chromium and its system libraries.
      - name: Install Chromium
        if: steps.plan.outputs.browser == 'true'
        run: pnpm --filter @repo/web-e2e exec playwright install --with-deps chromium
      # On pushes, every archive that comes from cache is built again and
      # compared, so a key that misses a change fails the run. Pull requests
      # skip the extra builds.
      - name: Build and test
        run: node tools/ci/run.ts test --out artifacts ${{ github.event_name == 'push' && '--verify' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: vercel-output
          path: artifacts/*.tar
          retention-days: 7
      # Production and preview builds have separate keys. Main builds preview
      # too, after archiving production, so pull requests can reuse it.
      - name: Store preview builds from trusted main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node tools/ci/run.ts build --target preview
      # Every save uploads the whole cache and counts against the repository's
      # cache quota. Skip the upload when nothing new was stored, and drop
      # entries no run has read for a week. The runner refreshes an entry's
      # time when it reuses it.
      - name: Drop entries unused for a week
        id: trim
        run: |
          before=$(cat "$RUNNER_TEMP/cache-entries")
          after=$(find .cache/ci -type f | wc -l)
          if [ "$after" -gt "$before" ]; then
            find .cache/ci -type f -mtime +7 -delete
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
          kept=$(find .cache/ci -type f | wc -l)
          echo "Cache entries: $before restored, $((after - before)) new, $kept kept." >> "$GITHUB_STEP_SUMMARY"
      - name: Save stored results
        if: steps.trim.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/ci
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-evidence
          path: packages/*-e2e/test-results/
          if-no-files-found: ignore

  deploy:
    name: Deploy tested ${{ matrix.app }} artifact
    needs: [test]
    # Fork PRs never receive deployment credentials. The byakugan branch preview
    # deploys on push to avoid duplicates. Whether deployment is configured is
    # checked inside the job, where environment settings are visible.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref != 'byakugan')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Apps deploy independently, so one app's failure never cancels another's.
      fail-fast: false
      matrix:
        app: [web, docs]
    concurrency:
      group: deploy-${{ github.repository }}-${{ github.ref }}-${{ matrix.app }}
      cancel-in-progress: false
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      # Settings can live on the repository or on the preview and production
      # environments. This reports what is missing without printing any value.
      - name: Check the deployment setup
        id: setup
        env:
          ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
          ENABLED: ${{ vars.VERCEL_DEPLOY_ENABLED == '1' }}
          ORG_ID: ${{ vars.VERCEL_ORG_ID != '' }}
          # An index lookup stays empty for a missing variable. The `a && b || c`
          # form would fall through to the other app's project.
          PROJECT_ID: ${{ vars[format('VERCEL_{0}_PROJECT_ID', matrix.app == 'web' && 'WEB' || 'DOCS')] != '' }}
          TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          BYPASS: ${{ secrets[format('VERCEL_{0}_BYPASS_SECRET', matrix.app == 'web' && 'WEB' || 'DOCS')] != '' }}
          PROJECT_ID_NAME: VERCEL_${{ matrix.app == 'web' && 'WEB' || 'DOCS' }}_PROJECT_ID
          BYPASS_NAME: VERCEL_${{ matrix.app == 'web' && 'WEB' || 'DOCS' }}_BYPASS_SECRET
        run: |
          missing=""
          [ "$ENABLED" = true ] || missing="$missing VERCEL_DEPLOY_ENABLED=1"
          [ "$ORG_ID" = true ] || missing="$missing VERCEL_ORG_ID"
          [ "$PROJECT_ID" = true ] || missing="$missing $PROJECT_ID_NAME"
          [ "$TOKEN" = true ] || missing="$missing VERCEL_TOKEN"
          if [ -n "$missing" ]; then
            line="Vercel deployment is off for $ENVIRONMENT. Missing:$missing."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            line="Vercel deployment is on for $ENVIRONMENT."
            [ "$BYPASS" = true ] || line="$line Add $BYPASS_NAME to check the live deployment."
          fi
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        if: steps.setup.outputs.deploy == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.setup.outputs.deploy == 'true'
      - uses: actions/setup-node@v7
        if: steps.setup.outputs.deploy == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.setup.outputs.deploy == 'true'
      - uses: actions/download-artifact@v8
        if: steps.setup.outputs.deploy == 'true'
        with:
          name: vercel-output
          path: artifacts
      - name: Check that this commit is still current
        id: current
        if: steps.setup.outputs.deploy == 'true'
        run: |
          latest=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping deployment for a superseded or deleted ref.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy without rebuilding
        id: deploy
        if: steps.current.outputs.deploy == 'true'
        env:
          APP: ${{ matrix.app }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars[format('VERCEL_{0}_PROJECT_ID', matrix.app == 'web' && 'WEB' || 'DOCS')] }}
          DEPLOY_TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
          DEPLOY_SCOPE: ${{ github.repository }}:${{ github.ref }}
          VERCEL_FORCE_DEPLOY: ${{ vars.VERCEL_FORCE_DEPLOY }}
        run: node scripts/deploy-vercel.ts "artifacts/$APP.tar" "$DEPLOY_TARGET"
      # Compares the live deployment, reused or new, with the archive the browser
      # tests passed. Protected deployments need the automation bypass secret.
      - name: Compare the deployment with the tested archive
        if: steps.deploy.outputs.url
        env:
          APP: ${{ matrix.app }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets[format('VERCEL_{0}_BYPASS_SECRET', matrix.app == 'web' && 'WEB' || 'DOCS')] }}
        run: node tools/ci/check-deployment.ts "artifacts/$APP.tar" "$DEPLOYMENT_URL"
