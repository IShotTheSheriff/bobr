name: CI (Bazel)

on:
  push:
    branches: ["main", "bazel"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  bazel:
    name: Build & test (Bazel)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: bazel-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      BAZEL_REMOTE_CACHE: ${{ vars.BAZEL_REMOTE_CACHE }}
      # Only trusted pushes get writer credentials. PRs require a backend-enforced
      # read-only credential; fork PRs receive no secrets from GitHub.
      BAZEL_REMOTE_HEADER: ${{ github.event_name == 'push' && secrets.BAZEL_REMOTE_WRITE_HEADER || secrets.BAZEL_REMOTE_READ_HEADER }}
      BAZEL_REMOTE_UPLOAD: ${{ github.event_name == 'push' && '1' || '0' }}
      DEPLOY_TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check CI helper behavior
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check deployment reuse behavior
        run: node --test scripts/test_vercel_reuse.cjs
      - name: Install Bazelisk
        run: npm install -g @bazel/bazelisk
      # Only the browser tests need these libraries. Installing them while Bazel
      # runs the other checks means a slow package mirror delays only those tests.
      - name: Start installing browser system libraries
        run: |
          (npx --yes playwright@1.61.0 install-deps chromium > "$RUNNER_TEMP/browser-deps.log" 2>&1
           echo $? > "$RUNNER_TEMP/browser-deps.status") &
      - name: Configure cache access
        env:
          PUBLIC_CACHE: ${{ vars.BAZEL_REMOTE_PUBLIC_READ }}
        run: |
          if [ -z "$BAZEL_REMOTE_HEADER" ] && [ "$PUBLIC_CACHE" != "1" ]; then
            echo 'BAZEL_REMOTE_CACHE=' >> "$GITHUB_ENV"
          fi
      - name: Restore Bazel disk and downloads
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .bazel-cache
            ~/.bazel-repo
          key: bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock', 'pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock', 'pnpm-lock.yaml') }}-
            bazel-${{ runner.os }}-${{ runner.arch }}-
            bazel-${{ runner.os }}-
      - name: Note the restored cache entries
        run: |
          mkdir -p .bazel-cache
          find .bazel-cache -type f | wc -l > "$RUNNER_TEMP/cache-entries"
          touch "$RUNNER_TEMP/cache-restored"
      - name: Build, then run checks that need no browser
        run: python3 scripts/bazel.py test //... --test_tag_filters=-browser --repository_cache="$HOME/.bazel-repo" --define="deploy_env=$DEPLOY_TARGET" --execution_log_json_file="$RUNNER_TEMP/checks.exec.json"
      - name: Wait for browser system libraries
        run: |
          while [ ! -f "$RUNNER_TEMP/browser-deps.status" ]; do sleep 2; done
          tail -n 3 "$RUNNER_TEMP/browser-deps.log"
          exit "$(cat "$RUNNER_TEMP/browser-deps.status")"
      - name: Run browser tests against the deployment archives
        run: python3 scripts/bazel.py test //... --repository_cache="$HOME/.bazel-repo" --define="deploy_env=$DEPLOY_TARGET" --execution_log_json_file="$RUNNER_TEMP/browser.exec.json"
      - name: Summarize what ran and what came from cache
        if: always()
        run: python3 scripts/ci-summary.py "$RUNNER_TEMP/checks.exec.json" "$RUNNER_TEMP/browser.exec.json"
      - name: Package the tested artifacts
        run: |
          mkdir -p artifacts
          for app in web docs; do
            cp "bazel-bin/apps/$app/vercel_output.tar" "artifacts/$app.tar"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vercel-output
          path: artifacts/*.tar
          retention-days: 7
      # Production and preview have separate action keys. Warm preview only after
      # archiving production so deployment still receives the tested production output.
      - name: Populate preview cache from trusted main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/bazel.py test //... --repository_cache="$HOME/.bazel-repo" --define=deploy_env=preview
      # Every save uploads the whole cache and counts against the repository's
      # cache quota. Keep only entries this run used, and skip the upload when
      # Bazel stored nothing new. Bazel refreshes the timestamp of each entry it
      # reads, so older entries were not used.
      - name: Keep only the cache entries this run used
        id: trim
        run: |
          before=$(cat "$RUNNER_TEMP/cache-entries")
          after=$(find .bazel-cache -type f | wc -l)
          if [ "$after" -gt "$before" ]; then
            find .bazel-cache -type f ! -newer "$RUNNER_TEMP/cache-restored" -delete
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
          kept=$(find .bazel-cache -type f | wc -l)
          echo "Cache entries: $before restored, $((after - before)) new, $kept kept." >> "$GITHUB_STEP_SUMMARY"
      - name: Save the build cache
        if: steps.trim.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .bazel-cache
            ~/.bazel-repo
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: bazel-testlogs/packages/*-e2e/test/
          if-no-files-found: ignore

  deploy:
    name: Deploy tested ${{ matrix.app }} artifact
    needs: [bazel]
    # Enable after configuring the account. Fork PRs never receive deployment
    # credentials. The bazel branch preview deploys on push to avoid duplicates.
    if: >-
      vars.VERCEL_DEPLOY_ENABLED == '1' &&
      (github.event_name == 'push' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref != 'bazel'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        app: [web, docs]
    concurrency:
      group: deploy-${{ github.repository }}-${{ github.ref }}-${{ matrix.app }}
      cancel-in-progress: false
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: vercel-output
          path: artifacts
      - name: Check that this commit is still current
        id: current
        run: |
          latest=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping deployment for a superseded or deleted ref.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy without rebuilding
        if: steps.current.outputs.deploy == 'true'
        env:
          APP: ${{ matrix.app }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ matrix.app == 'web' && vars.VERCEL_WEB_PROJECT_ID || vars.VERCEL_DOCS_PROJECT_ID }}
          DEPLOY_TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
          DEPLOY_SCOPE: ${{ github.repository }}:${{ github.ref }}
          VERCEL_FORCE_DEPLOY: ${{ vars.VERCEL_FORCE_DEPLOY }}
        run: node scripts/deploy-vercel.cjs "artifacts/$APP.tar" "$DEPLOY_TARGET"
